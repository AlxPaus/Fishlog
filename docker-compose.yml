x-patroni-env: &patroni-env
    PATRONI_SCOPE: fishlog_cluster
    PATRONI_NAMESPACE: /db
    PATRONI_ETCD3_HOSTS: etcd:2379
    PATRONI_SUPERUSER_USERNAME: ${POSTGRES_USER}
    PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
    PATRONI_REPLICATION_USERNAME: replicator
    PATRONI_REPLICATION_PASSWORD: replicator_pass
    PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data/pgdata
    PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
    PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
    PATRONI_POSTGRESQL_PG_HBA: "host all all 0.0.0.0/0 md5, host replication replicator 0.0.0.0/0 md5"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: fishlog_etcd
    environment:
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    restart: unless-stopped

  pg1:
    build:
      context: .
      dockerfile: Dockerfile.patroni
    container_name: fishlog_pg1
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
    depends_on:
      - etcd
    volumes:
      - pg1_data:/var/lib/postgresql/data
    restart: unless-stopped

  pg2:
    build:
      context: .
      dockerfile: Dockerfile.patroni
    container_name: fishlog_pg2
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
    depends_on:
      - etcd
    volumes:
      - pg2_data:/var/lib/postgresql/data
    restart: unless-stopped

  pg3:
    build:
      context: .
      dockerfile: Dockerfile.patroni
    container_name: fishlog_pg3
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg3
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg3:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg3:8008
    depends_on:
      - etcd
    volumes:
      - pg3_data:/var/lib/postgresql/data
    restart: unless-stopped

  haproxy:
    image: haproxy:2.8
    container_name: fishlog_haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432" 
      - "8404:8404" 
    depends_on:
      - pg1
      - pg2
      - pg3
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: fishlog_migrator
    env_file:
      - .env
    depends_on:
      - haproxy
    restart: "no"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fishlog_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres_exporter:exporter_password@haproxy:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - haproxy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: fishlog_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fishlog_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    
  minio:
    image: minio/minio:latest
    container_name: fishlog_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001" 
    volumes:
      - ./data/minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: fishlog_minio_init
    env_file:
      - .env
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    depends_on:
      - minio

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: fishlog_backup
    env_file:
      - .env
    depends_on:
      - haproxy
      - minio-init
    restart: unless-stopped

volumes:
  pg1_data:
  pg2_data:
  pg3_data: