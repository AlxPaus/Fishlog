services:
  db:
    image: postgres:15-alpine
    container_name: fishlog_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
      - ./scripts/init-metrics.sql:/docker-entrypoint-initdb.d/init-metrics.sql:ro

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: fishlog_migrator
    env_file:
      - .env
    depends_on:
      - db
    restart: "no"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fishlog_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres_exporter:exporter_password@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - db
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: fishlog_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fishlog_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped